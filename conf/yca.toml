# yca configuration.

[pki]
org_name = "Example 会社"
country_code = "CA"
# Host serving artifacts and ACME endpoint.
repository_host = "pki.example.ca"

[root]
cn = "ETS Root E1"
curve = "secp384r1"
digest = "SHA-384"
valid_days = 7164
slug_prefix = "root-e"
# key_backend = "internal"
# Optional: token label for split/hybrid layout.
# token_label = "ets-root"

[ca.tls]
profiles = ["server", "client"]
cn = "CA E1"
curve = "secp384r1"
digest = "SHA-384"
valid_days = 1194
slug_prefix = "ca-e"
# key_backend = "internal"
# Optional: for split token layout.
# token_label = "ets-ca"
ee_curve = "secp256r1"
ee_digest = "SHA-256"
ee_valid_days = 398
# Optional: reduce ee subject DN to the bare CN.
simple_dn = true
#
# Optional: bound a CA by who it may issue to.
# permitted_dns = ["example.ca"]
# Optional: CertificatePolicies OIDs per profile, verbatim.
# policies = { server = ["1.3.6.1.4.1.32473.1.1"], client = ["1.3.6.1.4.1.32473.1.2"] }

