[pki]
org_name = "Example 会社"
country_code = "CA"
repository_host = "pki.example.ca"
# arc_oid = "1.3.6.1.4.1.32473"

[root]
cn = "ETS Root E1"
curve = "secp384r1"
digest = "SHA-384"
valid_days = 7164
slug_prefix = "root-e"

[ca.tls]
profiles = ["server", "client"]
cn = "CA E1"
curve = "secp384r1"
digest = "SHA-384"
valid_days = 1194
slug_prefix = "ca-e"
ee_curve = "secp256r1"
ee_digest = "SHA-256"
ee_valid_days = 398
# Optional: reduce ee subject DN to the bare CN.
simple_dn = true
# Optional: bound a CA by who it may issue to.
# permitted_dns = ["example.ca"]       # also covers www.example.ca
# permitted_email = ["example.ca"]     # every mailbox at that host;
#                                      # ".example.ca" means subdomains only

# HSM-held CA keys (optional; default internal).
# [pkcs11]
# module = "/usr/lib/opensc-pkcs11.so"
# token_label = "ets"
