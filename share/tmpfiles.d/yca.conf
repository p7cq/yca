# yca directories and ownership. The service reads its config but cannot
# rewrite it; state is private to yca; published artifacts are world
# readable for the web server.
#
# The 'z' lines re-apply owner and mode on every tmpfiles run (boot,
# package install), so a stray chmod/chown is reverted. yca.env is read
# by systemd itself (EnvironmentFile=) before dropping to User=yca, so the
# service account never needs to read it.
d /etc/yca            0750 root yca  -
z /etc/yca/yca.toml   0640 root yca  -
z /etc/yca/yca.env    0600 root root -
d /var/lib/yca        0700 yca  yca  -
d /srv/yca            0755 root root -
d /srv/yca/pub        0755 yca  yca  -
d /srv/yca/webroot    0755 root root -
