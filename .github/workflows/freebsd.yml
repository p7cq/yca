name: FreeBSD package

# Reusable: builds the FreeBSD package  and uploads it as the
# artifact freebsd-package-<arch>. Called by release.yml (amd64) and
# release-freebsd-arm64.yml (arm64, slow).

on:
  workflow_call:
    inputs:
      arch:
        description: "amd64 or arm64"
        type: string
        required: true
      version:
        description: "package version (VERSION at the built commit)"
        type: string
        required: true
      ref:
        description: "commit to build (default: the caller's commit)"
        type: string
        default: ""

jobs:
  build:
    name: build .pkg (FreeBSD ${{ inputs.arch }})
    runs-on: ubuntu-latest
    # vmactions' docs: keep runs-on: ubuntu-latest even for aarch64.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - name: Build and package on FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          release: "15.1"
          arch: ${{ inputs.arch == 'arm64' && 'aarch64' || 'x86_64' }}
          usesh: true
          prepare: |
            pkg install -y cmake ninja go sqlite3 rsync git
          run: |
            set -e
            version="${{ inputs.version }}"

            cmake -B build -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX=/usr/local \
              -Wno-dev
            cmake --build build --target yca -j "$(sysctl -n hw.ncpu)"

            # The version is already embedded via -ldflags, VCS info
            # isn't needed. go-sqlite3 has no FreeBSD link flags for the
            # system SQLite (libsqlite3 tag), and the port lives in /usr/local.
            ( cd acme && CGO_CFLAGS=-I/usr/local/include \
                CGO_LDFLAGS="-L/usr/local/lib -lsqlite3" \
                go build -tags libsqlite3 -buildvcs=false \
                -ldflags "-X main.version=${version}" -o ../bin/yca-acme . )

            rm -rf stage
            DESTDIR=stage cmake --install build
            mkdir -p stage/usr/local/share/man/man1 \
                     stage/usr/local/share/zsh/site-functions \
                     stage/usr/local/share/bash-completion/completions \
                     stage/usr/local/etc/yca \
                     stage/usr/local/etc/rc.d \
                     stage/usr/local/etc/periodic/daily \
                     stage/usr/local/share/examples/yca/nginx \
                     stage/var/db/yca \
                     stage/srv/yca/pub \
                     stage/srv/yca/webroot
            install -m755 bin/yca-acme stage/usr/local/libexec/yca/yca-acme
            install -m644 share/man/yca-acme.1 stage/usr/local/share/man/man1/yca-acme.1
            install -m644 share/zsh-completion/_yca-acme \
              stage/usr/local/share/zsh/site-functions/_yca-acme
            install -m644 share/bash-completion/yca-acme \
              stage/usr/local/share/bash-completion/completions/yca-acme
            install -m600 yca.toml stage/usr/local/etc/yca/yca.toml
            install -m755 packaging/freebsd/rc.d/yca_acme \
              stage/usr/local/etc/rc.d/yca_acme
            install -m755 packaging/freebsd/periodic/500.yca-crl-refresh \
              stage/usr/local/etc/periodic/daily/500.yca-crl-refresh
            install -m755 packaging/freebsd/periodic/510.yca-acme-renew \
              stage/usr/local/etc/periodic/daily/510.yca-acme-renew
            install -m644 packaging/freebsd/crontab.sample \
              stage/usr/local/share/examples/yca/crontab.sample
            install -m644 share/nginx/freebsd/yca.conf \
              stage/usr/local/share/examples/yca/nginx/yca.conf

            abi="$(pkg config ABI)"
            sqlite_version="$(pkg query '%v' sqlite3)"
            rsync_version="$(pkg query '%v' rsync)"
            mkdir -p pkgmeta
            sed -e "s/%VERSION%/${version}/" \
                -e "s/%ABI%/${abi}/" \
                -e "s/%SQLITE_VERSION%/${sqlite_version}/" \
                -e "s/%RSYNC_VERSION%/${rsync_version}/" \
                packaging/freebsd/+MANIFEST > pkgmeta/+MANIFEST
            cp packaging/freebsd/+PRE_INSTALL pkgmeta/+PRE_INSTALL

            mkdir -p dist
            pkg create -v -m pkgmeta -r stage -p packaging/freebsd/pkg-plist -o dist
            os_major="$(echo "$abi" | cut -d: -f2)"
            cpu_arch="$(echo "$abi" | cut -d: -f3)"
            mv "dist/yca-${version}.pkg" "dist/yca-${version}-freebsd-${os_major}-${cpu_arch}.pkg"

            pkg add "dist/yca-${version}-freebsd-${os_major}-${cpu_arch}.pkg"
            sh tests/packaging/check-install.sh freebsd

      - name: Check artifact
        run: ls -la dist/

      - uses: actions/upload-artifact@v7
        with:
          name: freebsd-package-${{ inputs.arch }}
          path: dist/*.pkg
