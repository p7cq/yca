name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      include_arm64:
        description: "Also build arm64"
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check-version:
    name: check VERSION bump
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: check
        run: |
          version="$(cat VERSION)"
          tag="v${version}"
          before="${{ github.event.before }}"

          if [[ "$before" =~ ^0+$ ]] || ! git cat-file -e "$before" 2>/dev/null; then
            # First push to the branch, or a rewritten history: build once.
            changed=true
          elif git diff --quiet "$before" "${{ github.sha }}" -- VERSION; then
            changed=false
          else
            changed=true
          fi

          # Only push events auto-skip an already-tagged version; a manual
          # dispatch (e.g. to add arm64 assets to that same release) must
          # proceed even though the tag already exists.
          if [[ "${{ github.event_name }}" == "push" ]] && \
             git ls-remote --tags origin "refs/tags/${tag}" | grep -q "refs/tags/${tag}$"; then
            echo "tag ${tag} already exists, skipping" >&2
            changed=false
          fi

          echo "changed=${changed}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

  tag:
    name: tag release
    needs: check-version
    if: needs.check-version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # A manual re-run adding arm64 to an already-released version hits
      # an existing tag.
      - name: Create and push tag
        run: |
          tag="${{ needs.check-version.outputs.tag }}"
          if git ls-remote --tags origin "refs/tags/${tag}" | grep -q "refs/tags/${tag}$"; then
            echo "tag ${tag} already exists, not recreating"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "$tag"
            git push origin "$tag"
          fi

  build-deb:
    name: build .deb (${{ matrix.arch }})
    needs: check-version
    if: needs.check-version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: arm64
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v5

      # Job-level `container:` starts before any step runs.
      - name: Set up QEMU
        if: matrix.arch == 'arm64' && github.event.inputs.include_arm64 == 'true'
        uses: docker/setup-qemu-action@v4

      - name: Build .deb in container
        if: matrix.arch == 'amd64' || github.event.inputs.include_arm64 == 'true'
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          cat > ci-build-deb.sh <<'SCRIPT'
          #!/bin/sh
          set -eux
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git build-essential debhelper \
            clang clang-tools libclang-rt-dev cmake ninja-build \
            libc++-dev libc++abi-dev libsqlite3-dev pkg-config golang-go
          git config --global --add safe.directory /work
          cd /work
          printf 'yca (%s-1~trixie) unstable; urgency=medium\n\n  * Release %s.\n\n -- p7cq <707c71@gmail.com>  %s\n' \
            "$VERSION" "$VERSION" "$(date -R)" > debian/changelog
          dpkg-buildpackage -b -us -uc
          mkdir -p /work/dist
          mv /yca_*.deb /work/dist/
          apt-get install -y /work/dist/yca_*.deb
          /work/tests/packaging/check-install.sh linux
          SCRIPT
          chmod +x ci-build-deb.sh
          docker run --rm --platform=${{ matrix.platform }} \
            -e VERSION -v "${{ github.workspace }}:/work" -w /work \
            debian:trixie /work/ci-build-deb.sh
          rm -f ci-build-deb.sh

      # CMake 3.26+ logs try_compile checks (like the pthread probes) to
      # CMakeConfigureLog.yaml, not the old CMakeError.log. build/ is
      # inside the bind-mounted workspace, so it's visible here too.
      - name: CMake configure log
        if: failure()
        run: |
          echo ":: CMake Diagnostic Log ::"
          cat build/CMakeFiles/CMakeConfigureLog.yaml 2>/dev/null || echo "(no CMakeConfigureLog.yaml)"
          echo ":: End CMake Diagnostic Log ::"

      - uses: actions/upload-artifact@v7
        if: matrix.arch == 'amd64' || github.event.inputs.include_arm64 == 'true'
        with:
          name: deb-package-${{ matrix.arch }}
          path: dist/*.deb

  build-rpm:
    name: build .rpm (${{ matrix.arch }})
    needs: check-version
    if: needs.check-version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: arm64
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v5

      # See build-deb: job-level `container:` starts before any step, so
      # QEMU can't be registered in time for a foreign platform.
      - name: Set up QEMU
        if: matrix.arch == 'arm64' && github.event.inputs.include_arm64 == 'true'
        uses: docker/setup-qemu-action@v4

      - name: Build .rpm in container
        if: matrix.arch == 'amd64' || github.event.inputs.include_arm64 == 'true'
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          cat > ci-build-rpm.sh <<'SCRIPT'
          #!/bin/sh
          set -eux
          dnf install -y clang cmake ninja-build sqlite-devel \
            libcxx-devel libcxxabi-devel golang pkgconf-pkg-config \
            rpm-build systemd-rpm-macros git
          git config --global --add safe.directory /work
          cd /work
          mkdir -p "$HOME/rpmbuild/SOURCES" "$HOME/rpmbuild/SPECS"
          git archive --format=tar.gz --prefix="yca-${VERSION}/" \
            -o "$HOME/rpmbuild/SOURCES/yca-${VERSION}.tar.gz" HEAD
          cp packaging/rpm/yca.spec "$HOME/rpmbuild/SPECS/"
          rpmbuild --define "version ${VERSION}" -bb "$HOME/rpmbuild/SPECS/yca.spec"
          mkdir -p /work/dist
          cp "$HOME"/rpmbuild/RPMS/*/*.rpm /work/dist/
          dnf install -y /work/dist/*.rpm
          /work/tests/packaging/check-install.sh linux
          SCRIPT
          chmod +x ci-build-rpm.sh
          docker run --rm --platform=${{ matrix.platform }} \
            -e VERSION -v "${{ github.workspace }}:/work" -w /work \
            fedora:latest /work/ci-build-rpm.sh
          rm -f ci-build-rpm.sh

      # Native rpmbuild filename encodes the Fedora version and arch.
      - uses: actions/upload-artifact@v7
        if: matrix.arch == 'amd64' || github.event.inputs.include_arm64 == 'true'
        with:
          name: rpm-package-${{ matrix.arch }}
          path: dist/*.rpm

  build-arch:
    name: build .pkg.tar.zst
    needs: check-version
    if: needs.check-version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm base-devel clang cmake ninja go sqlite git \
            libc++ libc++abi rsync

      - uses: actions/checkout@v5

      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build package
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          su builder -c "cd '$GITHUB_WORKSPACE' && makepkg -f --noconfirm"

      - name: Collect artifact
        run: |
          mkdir -p dist
          mv ./*.pkg.tar.zst dist/

      - name: Install and check package
        run: |
          pacman -U --noconfirm dist/*.pkg.tar.zst
          tests/packaging/check-install.sh linux

      - uses: actions/upload-artifact@v7
        with:
          name: arch-package
          path: dist/*.pkg.tar.zst

  build-freebsd:
    name: build .pkg (FreeBSD ${{ matrix.arch }})
    needs: check-version
    if: needs.check-version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    # vmactions' docs: keep runs-on: ubuntu-latest even for aarch64.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            vm_arch: x86_64
          - arch: arm64
            vm_arch: aarch64
    steps:
      - uses: actions/checkout@v5

      - name: Build and package on FreeBSD
        if: matrix.arch == 'amd64' || github.event.inputs.include_arm64 == 'true'
        uses: vmactions/freebsd-vm@v1
        with:
          release: "15.1"
          arch: ${{ matrix.vm_arch }}
          usesh: true
          prepare: |
            pkg install -y cmake ninja go sqlite3 rsync git
          run: |
            set -e
            version="${{ needs.check-version.outputs.version }}"

            cmake -B build -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX=/usr/local \
              -Wno-dev
            cmake --build build --target yca -j "$(sysctl -n hw.ncpu)"

            # The version is already embedded via -ldflags, VCS info
            # isn't needed.
            ( cd acme && go build -buildvcs=false \
                -ldflags "-X main.version=${version}" -o ../bin/yca-acme . )

            rm -rf stage
            DESTDIR=stage cmake --install build
            mkdir -p stage/usr/local/share/man/man1 \
                     stage/usr/local/share/zsh/site-functions \
                     stage/usr/local/etc/yca \
                     stage/usr/local/etc/rc.d \
                     stage/usr/local/etc/periodic/daily \
                     stage/usr/local/share/examples/yca/nginx \
                     stage/var/db/yca \
                     stage/srv/yca/pub \
                     stage/srv/yca/webroot
            install -m755 bin/yca-acme stage/usr/local/bin/yca-acme
            install -m644 share/man/yca-acme.1 stage/usr/local/share/man/man1/yca-acme.1
            install -m644 share/zsh-completion/_yca-acme \
              stage/usr/local/share/zsh/site-functions/_yca-acme
            install -m600 yca.toml stage/usr/local/etc/yca/yca.toml
            install -m755 packaging/freebsd/rc.d/yca_acme \
              stage/usr/local/etc/rc.d/yca_acme
            install -m755 packaging/freebsd/periodic/500.yca-crl-refresh \
              stage/usr/local/etc/periodic/daily/500.yca-crl-refresh
            install -m755 packaging/freebsd/periodic/510.yca-acme-renew \
              stage/usr/local/etc/periodic/daily/510.yca-acme-renew
            install -m644 packaging/freebsd/crontab.sample \
              stage/usr/local/share/examples/yca/crontab.sample
            install -m644 share/nginx/freebsd/yca.conf \
              stage/usr/local/share/examples/yca/nginx/yca.conf

            abi="$(pkg config ABI)"
            sqlite_version="$(pkg query '%v' sqlite3)"
            rsync_version="$(pkg query '%v' rsync)"
            mkdir -p pkgmeta
            sed -e "s/%VERSION%/${version}/" \
                -e "s/%ABI%/${abi}/" \
                -e "s/%SQLITE_VERSION%/${sqlite_version}/" \
                -e "s/%RSYNC_VERSION%/${rsync_version}/" \
                packaging/freebsd/+MANIFEST > pkgmeta/+MANIFEST
            cp packaging/freebsd/+PRE_INSTALL pkgmeta/+PRE_INSTALL

            mkdir -p dist
            pkg create -v -m pkgmeta -r stage -p packaging/freebsd/pkg-plist -o dist
            os_major="$(echo "$abi" | cut -d: -f2)"
            cpu_arch="$(echo "$abi" | cut -d: -f3)"
            mv "dist/yca-${version}.pkg" "dist/yca-${version}-freebsd-${os_major}-${cpu_arch}.pkg"

            pkg add "dist/yca-${version}-freebsd-${os_major}-${cpu_arch}.pkg"
            sh tests/packaging/check-install.sh freebsd

      - name: Check artifact
        if: matrix.arch == 'amd64' || github.event.inputs.include_arm64 == 'true'
        run: ls -la dist/

      - uses: actions/upload-artifact@v7
        if: matrix.arch == 'amd64' || github.event.inputs.include_arm64 == 'true'
        with:
          name: freebsd-package-${{ matrix.arch }}
          path: dist/*.pkg

  build-gentoo:
    name: update Gentoo ebuild + Manifest
    needs: [check-version, tag]
    if: needs.check-version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: false

      # The ebuild's SRC_URI is the tag's GitHub-generated tarball, so
      # digests can only be computed once the tag from the `tag` job
      # exists. The second distfile lets yca-acme build offline under
      # Portage's network-sandbox.
      - name: Update ebuild filename and Manifest
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          dir=packaging/gentoo/app-crypt/yca
          ebuild_new="${dir}/yca-${VERSION}.ebuild"

          tarball="$(mktemp)"
          curl -fsSL -o "$tarball" \
            "https://github.com/p7cq/yca/archive/refs/tags/v${VERSION}.tar.gz"

          # A re-run (e.g. the arm64 dispatch) must produce the same bytes.
          src="$(mktemp -d)"
          tar -xzf "$tarball" -C "$src"
          (cd "${src}/yca-${VERSION}/acme" && go mod vendor)
          mkdir -p dist
          vendor="dist/yca-${VERSION}-vendor.tar.xz"
          tar -C "$src" --sort=name --owner=0 --group=0 --numeric-owner \
            --mtime=@0 --pax-option=delete=atime,delete=ctime \
            -cJf "$vendor" "yca-${VERSION}/acme/vendor"

          # Digests are computed on master, not on the commit that
          # started this run: master may have moved during the build
          # and expectedHeadOid would refuse the commit.
          for attempt in 1 2 3 4 5; do
            git fetch --depth=1 origin master
            git reset --hard FETCH_HEAD
            if [ "$(cat VERSION)" != "$VERSION" ]; then
              echo "master is at $(cat VERSION); its own run updates the ebuild"
              exit 0
            fi

            old="$(ls "${dir}"/*.ebuild)"
            if [ "$old" != "$ebuild_new" ]; then
              git mv "$old" "$ebuild_new"
            fi

            {
              printf 'DIST yca-%s.tar.gz %s BLAKE2B %s SHA512 %s\n' \
                "$VERSION" \
                "$(stat -c%s "$tarball")" \
                "$(b2sum "$tarball" | cut -d' ' -f1)" \
                "$(sha512sum "$tarball" | cut -d' ' -f1)"
              printf 'DIST yca-%s-vendor.tar.xz %s BLAKE2B %s SHA512 %s\n' \
                "$VERSION" \
                "$(stat -c%s "$vendor")" \
                "$(b2sum "$vendor" | cut -d' ' -f1)" \
                "$(sha512sum "$vendor" | cut -d' ' -f1)"
              printf 'EBUILD yca-%s.ebuild %s BLAKE2B %s SHA512 %s\n' \
                "$VERSION" \
                "$(stat -c%s "$ebuild_new")" \
                "$(b2sum "$ebuild_new" | cut -d' ' -f1)" \
                "$(sha512sum "$ebuild_new" | cut -d' ' -f1)"
            } > "${dir}/Manifest"

            # acct-group/yca, acct-user/yca: no distfiles, EBUILD digests only.
            for acct in packaging/gentoo/acct-group/yca packaging/gentoo/acct-user/yca; do
              for e in "${acct}"/*.ebuild; do
                printf 'EBUILD %s %s BLAKE2B %s SHA512 %s\n' \
                  "$(basename "$e")" \
                  "$(stat -c%s "$e")" \
                  "$(b2sum "$e" | cut -d' ' -f1)" \
                  "$(sha512sum "$e" | cut -d' ' -f1)"
              done > "${acct}/Manifest"
            done

            git add packaging/gentoo
            if git diff --cached --quiet; then
              echo "no Gentoo packaging changes"
              exit 0
            fi

            head="$(git rev-parse HEAD)"
            adds="$(git diff --cached --no-renames --name-only --diff-filter=AM |
              while read -r f; do
                jq -n --arg p "$f" --arg c "$(base64 -w0 "$f")" \
                  '{path: $p, contents: $c}'
              done | jq -s .)"
            dels="$(git diff --cached --no-renames --name-only --diff-filter=D |
              jq -R . | jq -s 'map({path: .})')"

            if jq -n \
              --arg repo "$GITHUB_REPOSITORY" \
              --arg head "$head" \
              --arg msg "chore(gentoo): update app-crypt/yca for v${VERSION}" \
              --argjson adds "$adds" \
              --argjson dels "$dels" \
              '{query: "mutation($i: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $i) { commit { url } } }",
                variables: {i: {
                  branch: {repositoryNameWithOwner: $repo, branchName: "master"},
                  message: {headline: $msg},
                  expectedHeadOid: $head,
                  fileChanges: {additions: $adds, deletions: $dels}}}}' |
              gh api graphql --input -; then
              exit 0
            fi
            echo "commit refused (attempt ${attempt}), master moved; retrying" >&2
            sleep 10
          done
          echo "could not commit the Gentoo update after 5 attempts" >&2
          exit 1

      - uses: actions/upload-artifact@v7
        with:
          name: gentoo-vendor
          path: dist/*.tar.xz

  release:
    name: publish release
    needs: [check-version, tag, build-deb, build-rpm, build-arch, build-freebsd, build-gentoo]
    if: needs.check-version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-version.outputs.tag }}
          generate_release_notes: true
          files: dist/*
