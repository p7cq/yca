name: Release

on:
  push:
    branches: [master]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check-version:
    name: check VERSION bump
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: check
        run: |
          version="$(cat VERSION)"
          tag="v${version}"
          before="${{ github.event.before }}"

          if [[ "$before" =~ ^0+$ ]] || ! git cat-file -e "$before" 2>/dev/null; then
            # First push to the branch, or a rewritten history: build once.
            changed=true
          elif git diff --quiet "$before" "${{ github.sha }}" -- VERSION; then
            changed=false
          else
            changed=true
          fi

          if git ls-remote --tags origin "refs/tags/${tag}" | grep -q "refs/tags/${tag}$"; then
            echo "tag ${tag} already exists, skipping" >&2
            changed=false
          fi

          echo "changed=${changed}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

  build-deb:
    name: build .deb
    needs: check-version
    if: needs.check-version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - uses: actions/checkout@v5

      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates build-essential debhelper devscripts \
            clang cmake ninja-build libc++-dev libc++abi-dev \
            libsqlite3-dev pkg-config golang-go

      - name: Sync changelog with VERSION
        run: |
          version="${{ needs.check-version.outputs.version }}"
          dch --create --package yca --newversion "${version}-1" \
            --distribution unstable "Release ${version}."

      - name: Build package
        run: dpkg-buildpackage -b -us -uc

      - name: Collect artifact
        run: |
          mkdir -p dist
          mv ../yca_*.deb dist/

      - uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: dist/*.deb

  build-rpm:
    name: build .rpm
    needs: check-version
    if: needs.check-version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - uses: actions/checkout@v5

      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install build dependencies
        run: |
          dnf install -y clang cmake ninja-build sqlite-devel \
            libcxx-devel libcxxabi-devel golang pkgconf-pkg-config \
            rpm-build git

      - name: Build source tarball
        run: |
          version="${{ needs.check-version.outputs.version }}"
          mkdir -p "$HOME/rpmbuild/SOURCES" "$HOME/rpmbuild/SPECS"
          git archive --format=tar.gz --prefix="yca-${version}/" \
            -o "$HOME/rpmbuild/SOURCES/yca-${version}.tar.gz" HEAD
          cp packaging/rpm/yca.spec "$HOME/rpmbuild/SPECS/"

      - name: Build package
        run: |
          rpmbuild --define "version ${{ needs.check-version.outputs.version }}" \
            -bb "$HOME/rpmbuild/SPECS/yca.spec"

      - name: Collect artifact
        run: |
          mkdir -p dist
          cp "$HOME"/rpmbuild/RPMS/*/*.rpm dist/

      - uses: actions/upload-artifact@v4
        with:
          name: rpm-package
          path: dist/*.rpm

  build-arch:
    name: build .pkg.tar.zst
    needs: check-version
    if: needs.check-version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v5

      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install build dependencies
        run: pacman -Syu --noconfirm base-devel clang cmake ninja go sqlite git

      - name: Sync pkgver with VERSION
        run: |
          version="${{ needs.check-version.outputs.version }}"
          sed -i "s/^pkgver=.*/pkgver=${version}/" PKGBUILD

      # makepkg refuses to run as root.
      - name: Build package
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          su builder -c "cd '$GITHUB_WORKSPACE' && makepkg -f --noconfirm"

      - name: Collect artifact
        run: |
          mkdir -p dist
          mv ./*.pkg.tar.zst dist/

      - uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: dist/*.pkg.tar.zst

  release:
    name: tag + publish release
    needs: [check-version, build-deb, build-rpm, build-arch]
    if: needs.check-version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Create and push tag
        run: |
          tag="${{ needs.check-version.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$tag"
          git push origin "$tag"

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-version.outputs.tag }}
          generate_release_notes: true
          files: dist/*
